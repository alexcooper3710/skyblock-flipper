<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyBlock Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230ca30c'/%3E%3Cpath d='M16 8l7 12H9z' fill='%2306240f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="top">
  <span class="brand"><span class="dot" id="dot"></span>SKYBLOCK TERMINAL</span>
  <span class="kv">snap <b id="s-snap">—</b></span>
  <span class="kv">auctions <b id="s-auc">—</b></span>
  <span class="kv">cycle <b id="s-cycle">—</b></span>
  <span class="kv">sold <b id="s-sold">—</b></span>
  <span class="kv">db <b id="s-db">—</b></span>
  <span class="grow"></span>
  <input id="search" placeholder="search item…" autocomplete="off" spellcheck="false">
  <button class="bell" id="bell">alerts <b id="s-alerts">0</b></button>
  <button class="bell" id="keybtn" title="Hypixel API key (optional - stored in this browser only)">key</button>
  <button class="bell" id="exportbtn" title="Save your collected history to a file">save</button>
  <button class="bell" id="importbtn" title="Load a saved history file">load</button>
  <input type="file" id="importfile" accept="application/json" hidden>
</div>

<div id="grid">
  <!-- 1. flip feed -->
  <section class="panel">
    <div class="phead"><span class="t">Flips</span>
      <div class="seg" id="flip-filter">
        <button class="on" data-f="all">all</button>
        <button data-f="lowest-bin">bin</button>
        <button data-f="sold-median">sold</button>
        <button data-f="attribute">attr</button>
      </div>
    </div>
    <div class="pbody" id="flips"><div class="empty">Waiting for the next snapshot…</div></div>
  </section>

  <!-- 2. item detail -->
  <section class="panel">
    <div class="phead"><span class="t" id="item-title">Item</span>
      <div class="seg" id="range">
        <button data-r="1h">1h</button>
        <button data-r="6h">6h</button>
        <button class="on" data-r="24h">24h</button>
        <button data-r="7d">7d</button>
        <button data-r="30d">30d</button>
        <button data-r="all">all</button>
      </div>
    </div>
    <div class="pbody" id="item"><div class="empty">Pick a flip, search, or click any row.</div></div>
  </section>

  <!-- 3. bazaar -->
  <section class="panel">
    <div class="phead"><span class="t">Bazaar</span>
      <div class="seg" id="bz-mode">
        <button class="on" data-m="orders">flips</button>
        <button data-m="crafts">crafts</button>
        <button data-m="browse">book</button>
      </div>
    </div>
    <input id="bz-search" placeholder="filter the book…" autocomplete="off" spellcheck="false" style="display:none">
    <div class="pbody" id="bazaar"><div class="empty">Bazaar refreshes every 60s…</div></div>
  </section>

  <!-- 4. market overview -->
  <section class="panel">
    <div class="phead"><span class="t">Market</span>
      <div class="seg" id="ov-mode">
        <button class="on" data-m="movers">ah movers</button>
        <button data-m="bz">bz movers</button>
        <button data-m="volume">volume</button>
        <button data-m="spreads">spreads</button>
      </div>
    </div>
    <div class="pbody" id="overview"><div class="empty">Needs a little history first…</div></div>
  </section>

  <!-- watchlist -->
  <section class="panel">
    <div class="phead"><span class="t">Watchlist</span></div>
    <div class="pbody" id="watchlist"><div class="empty">Open an item and hit Watch.</div></div>
  </section>

  <!-- alerts -->
  <section class="panel">
    <div class="phead"><span class="t">Alerts</span>
      <div class="seg"><button class="act" id="clear-alerts">mark read</button></div>
    </div>
    <div class="pbody" id="alerts"><div class="empty">Nothing yet.</div></div>
  </section>
</div>

<div id="tip"></div>
<div id="drop"></div>
<script type="module" src="local-api.js"></script>
<script defer src="app.js"></script>
<script defer src="local-extras.js"></script>
</body>
</html>
